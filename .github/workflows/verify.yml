name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build, test, bake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Undine.slnx --locked-mode

      - name: Build
        run: dotnet build Undine.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/Undine.Tests/Undine.Tests.csproj -c Release -f net10.0 --no-build

      - name: Bake the site data and require it to be committed
        run: |
          dotnet run --project tools/Undine.Bake -c Release --no-build
          git diff --exit-code -- site/Undine.Site/wwwroot/data/liquids.json

      - name: Require the site to serve the shaders it hands out
        run: |
          for f in undine-water-sim.frag.glsl undine-water-caustics.vert.glsl undine-water.frag.glsl UndineWater.hlsl undine_water.gdshader; do
            cmp "shaders/$f" "site/Undine.Site/wwwroot/shaders/$f"
          done
